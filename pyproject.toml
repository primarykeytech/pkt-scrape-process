[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pkt-scrape-process"
version = "0.2.0"
description = "Offline-first demonstration of a scrape-to-analysis data pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5", "boto3>=1.34,<2", "duckdb>=1.4,<2", "moto[dynamodb]>=5,<6", "pandas>=2.2,<3", "pyarrow>=16,<20", "selenium>=4.18,<5", "wordcloud>=1.9,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
# Spark is deliberately isolated from the portable offline demo.  The exact
# release is the one exercised by the local verification command and CI.
spark = ["pyspark==3.5.1"]
dagster = ["dagster>=1.13,<1.14", "dagster-webserver>=1.13,<1.14", "filelock>=3,<5"]

[project.scripts]
pkt-scrape = "pktscrape.__main__:main"
pkt-scrape-spark = "pktscrape.spark_job:main"

[tool.setuptools.packages.find]
include = ["pktscrape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "I001"]
